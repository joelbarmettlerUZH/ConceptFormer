[project]
name = "conceptformer"
version = "2.0.0"
description = "ConceptFormer v2 — encode an entity's knowledge-graph neighborhood into soft concept tokens for a frozen LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Joel Barmettler", email = "joel.barmettler@gmail.com" }]

# Data-layer dependencies (phase 1: graph snapshot + dataset construction).
# Training/model deps (torch, transformers, vllm, accelerate) are added in a
# later `train` group so the data pipeline stays lightweight to install.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.4",
    "typer>=0.12",
    "datasets>=2.20",
    "tqdm>=4.66",
    "rich>=13.7",
    "openai>=1.40",  # typed client for the vLLM OpenAI server (CF-Train generation)
]

[project.scripts]
conceptformer = "conceptformer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "ty>=0.0.1a1",
]
# Inference deps for experiments (teacher validation, RAG baseline). Heavy; install
# explicitly with `uv sync --group infer`.
infer = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=0.30",
    "wandb>=0.18",
]
# Plotting for paper/grant figures. Kept out of infer so GPU installs stay lean.
viz = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conceptformer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify,
# RUF ruff, ANN annotations, TCH type-checking, RET returns, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "RET", "C4", "PTH"]
# datasets rows are untyped; allow Any in those narrow spots via per-file ignores.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # test bodies don't need return annotations

[tool.pytest.ini_options]
markers = ["integration: hits the live Wikidata API (deselect with -m 'not integration')"]
