# Accelerate configuration for 2x RTX 4090 setup
# Launch: accelerate launch --config_file accelerate_config.yaml train_conceptformer.py
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
mixed_precision: bf16
num_machines: 1
num_processes: 2
gpu_ids: "0,1"
main_training_function: main
downcast_bf16: "no"
machine_rank: 0
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
